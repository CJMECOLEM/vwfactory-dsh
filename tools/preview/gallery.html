<!doctype html>
<!-- UI preview without DSH: renders plugin/client.js with fake demo data.
     Open in a browser: tools/preview/gallery.html?shot=settings | settings-dark | balance | pill (append -en for English)
     Regenerate README screenshots: powershell -ExecutionPolicy Bypass -File tools/preview/render.ps1 -->
<html><head><meta charset="utf-8">
<style>
:root{--dsw-alias-label-primary:#1f2329;--dsw-alias-label-secondary:#4e5560;--dsw-alias-label-tertiary:#8a9099;
--dsw-alias-border-l2:#dcdfe4;--dsw-alias-bg-layer-1:#fff;--dsw-alias-bg-layer-2:#fff;--dsw-alias-interactive-bg-hover:rgba(0,0,0,.05);
--dsw-alias-state-business-primary:#3b7cf0;--dsw-alias-state-error-primary:#e5484d;--dsw-alias-state-success-primary:#2fb45a;--page:#fff;--card:#f6f7f9}
html.dark{--dsw-alias-label-primary:#e8eaed;--dsw-alias-label-secondary:#b4b9c2;--dsw-alias-label-tertiary:#80868f;
--dsw-alias-border-l2:#363a42;--dsw-alias-bg-layer-1:#1d1f23;--dsw-alias-bg-layer-2:#24272c;--dsw-alias-interactive-bg-hover:rgba(255,255,255,.07);
--dsw-alias-state-business-primary:#5b93f5;--dsw-alias-state-error-primary:#f0666b;--dsw-alias-state-success-primary:#3cc46a;--page:#1d1f23;--card:#24272c}
body{margin:0;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;background:var(--page);color:var(--dsw-alias-label-primary)}
#root{padding:28px 32px 20px;box-sizing:border-box;width:100%}
/* composer mock for the pill shot */
.cmp{position:fixed;left:40px;right:40px;bottom:28px}
.cmp-box{border:1px solid var(--dsw-alias-border-l2);border-radius:18px;background:var(--dsw-alias-bg-layer-2);padding:14px 16px 10px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.cmp-ph{color:var(--dsw-alias-label-tertiary);font-size:14px;height:44px}
.cmp-row{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.cmp-chip{font-size:12.5px;color:var(--dsw-alias-label-secondary);border:1px solid var(--dsw-alias-border-l2);border-radius:999px;padding:3px 10px}
.cmp-send{width:30px;height:30px;border-radius:50%;background:var(--dsw-alias-state-business-primary);color:#fff;display:grid;place-items:center;font-size:15px}
.cmp-dock{padding:6px 6px 0;font-size:13px}
.chat{padding:30px 48px;font-size:14px;line-height:1.7;color:var(--dsw-alias-label-secondary)}
.chat .u{margin-left:auto;width:fit-content;max-width:60%;background:var(--card);border-radius:14px;padding:8px 14px;color:var(--dsw-alias-label-primary)}
</style>

</head><body><div id="root"></div>

<script src="../../plugin/client.js"></script>
<script>
let dict;
const comps = {};
const lang = /-en/.test(shot) ? "en" : "zh";
const t = (k) => (dict && dict[lang][k]) ?? k;
const slots = { inject: (_n, f) => f(), register: (o, C) => { comps[o.name] = C; } };
mod.apply({
  locale: { bind: () => t, register: (_ns, d) => { dict = d; } },

  inject: (_deps, f) => f({ effect: (g) => g(), slots, sidebarRightTabs: { register: () => {} }, modelDirectories: {} })
});
const e = React.createElement;
const root = document.getElementById("root");
// gl-pill: the session's model is a Gumloop one
const gl = /gl-pill/.test(shot);
const glSnap = { current: { provider: "gumloop", model: "claude-sonnet-5-5" } };
const glStore = { subscribe: () => () => {}, getSnapshot: () => glSnap };
if (/pill/.test(shot)) {
  root.style.cssText = "padding:0;width:auto";
  ReactDOM.createRoot(root).render(e(React.Fragment, null,
    e("div", { className: "chat" },
      e("div", { className: "u" }, "帮我重构一下 proxy 的重试逻辑，顺便补上测试"),
      e("p", null, "好的，我先看一下 proxyRetrying 和 failover 的调用关系……")),
    e("div", { className: "cmp" },
      e("div", { className: "cmp-box" },
        e("div", { className: "cmp-ph" }, "继续对话，Enter 发送"),
        e("div", { className: "cmp-row" }, e("span", { className: "cmp-chip" }, gl ? "Gumloop · Claude 5.5 Sonnet" : "Claude Opus 5.5 · 1.6×"), e("span", { className: "cmp-send" }, "↑"))),
      e("div", { className: "cmp-dock" }, e(comps["conversation.composer.dock"], gl ? { modelStore: glStore } : {})))));

  const tryOpen = () => { const p = document.querySelector(".vwf-pill"); if (p && !/加载|Loading/.test(p.textContent)) p.click(); else setTimeout(tryOpen, 50); };
  setTimeout(tryOpen, 150);

</script>
</body></html>
